name: Scrape DANE monthly

on:
  schedule:
    # Run on the 5th of each month at 03:00 UTC. Adjust as needed.
    - cron: "0 3 5 * *"
  workflow_dispatch:  # allow manual runs

jobs:
  scrape:
    name: Scrape and update sources.json
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Sync data into pulso/data/
        run: python scripts/sync_data.py

      - name: Install package with scraper extras
        working-directory: python
        run: pip install -e ".[dev,scraper]"

      - name: Run scraper
        id: scrape
        # No continue-on-error: a failed scrape must turn the run red. Until
        # 2026-11 this step called a stub and the job still reported success,
        # which is why the catalog silently stopped at 2026-02.
        run: |
          python python/scripts/agent_scraper.py \
            --output data/sources.json \
            --r-copy r/inst/extdata/sources.json \
            --report scrape_report.md
          {
            echo "report<<SCRAPE_REPORT_EOF"
            cat scrape_report.md
            echo "SCRAPE_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Re-sync canonical data into pulso/data/ before validation
        run: python scripts/sync_data.py

      - name: Validate updated sources.json
        working-directory: python
        run: pytest tests/unit/test_schemas.py -v

      - name: Open PR with changes
        uses: peter-evans/create-pull-request@v8
        with:
          branch: feat/data-monthly-scrape
          base: main
          commit-message: "data: monthly scrape of DANE portal"
          title: "data: monthly scrape (${{ github.run_id }})"
          body: |
            Automated PR from the monthly scraper.

            ## Scrape report

            ${{ steps.scrape.outputs.report }}

            ## Checklist for human reviewer

            - [ ] New entries have plausible URLs
            - [ ] No previously-validated entries got their `validated` flag flipped
            - [ ] Spot-check one new month by downloading and inspecting the ZIP
          labels: |
            data
            automated
