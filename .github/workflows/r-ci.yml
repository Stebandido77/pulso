name: R CI

# Runs R CMD check across OS x R-version matrix.
# Scoped to changes under r/ or data/ so Python-only PRs don't trigger R CI.

on:
  push:
    branches:
      - main
      - "feat/**"
      - "feature/**"
      - "fix/**"
      - "docs/**"
    paths:
      - "r/**"
      - "data/**"
      - "scripts/sync_data_to_r.R"
      - ".github/workflows/r-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "r/**"
      - "data/**"
      - "scripts/sync_data_to_r.R"
      - ".github/workflows/r-ci.yml"

concurrency:
  group: r-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    name: R CMD check (${{ matrix.config.os }} R-${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest,  r: "release" }
          - { os: ubuntu-latest,  r: "devel"   }
          - { os: macos-latest,   r: "release" }
          - { os: windows-latest, r: "release" }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: |
            any::rcmdcheck
            any::testthat
          needs: check

      - name: Sync canonical data into r/inst/extdata/
        run: Rscript scripts/sync_data_to_r.R

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          upload-snapshots: true
          # --as-cran is only enforced in r-check.yml; here we keep it lighter.
          args: 'c("--no-manual", "--no-build-vignettes")'
          error-on: '"warning"'

  lint:
    name: lintr (R ${{ matrix.r }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r: ["release"]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::lintr, any::styler
      - name: Lint
        working-directory: r
        run: Rscript -e 'lintr::lint_package()'
        # Soft-fail until R sources exist (Agente 5 fills R/).
        continue-on-error: true
